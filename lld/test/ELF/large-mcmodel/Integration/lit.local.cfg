# Integration tests require clang to be built
import os
import lit.util

# Find clang in the build directory
clang_path = os.path.join(config.llvm_tools_dir, 'clang')
clangxx_path = os.path.join(config.llvm_tools_dir, 'clang++')

if os.path.exists(clang_path):
    config.available_features.add('clang')
    config.substitutions.append(('%clangxx', clangxx_path))
    config.substitutions.append(('%clang', clang_path))
else:
    config.unsupported = True
